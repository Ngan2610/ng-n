# CD (web): mỗi lần nhánh main qua được test, tự đưa web lên GitHub Pages
# Cần bật: Settings > Pages > Source = "GitHub Actions"
name: CD Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # GitHub Pages chỉ phục vụ web tĩnh; cần API đã triển khai riêng.
    if: ${{ vars.VITE_API_URL != '' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Cài đặt, lint và test
        working-directory: web
        run: |
          npm ci
          npm run lint
          npm test
      - name: Build
        working-directory: web
        env:
          # Bắt buộc: URL HTTPS Backend SQL đã triển khai, CORS cho phép miền Pages.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deployment
        uses: actions/deploy-pages@v4
